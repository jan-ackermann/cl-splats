[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cl-splats"
version = "0.1.0"
description = "Continual-learning Gaussian Splatting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "torch>=2.0",
    "torchvision",
    "numpy>=1.24,<2",
    "omegaconf>=2.3",
    "hydra-core>=1.3",
    "loguru",
    "Pillow",
    "plyfile",
    "scipy",
    "opencv-python",
    "typer",
]

[project.optional-dependencies]
train = [
    "wandb",
    "transformers",
    "torchmetrics[image]",
]
gsplat = [
    "gsplat",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pyright",
    "ruff",
]

[project.scripts]
cl-splats-train = "clsplats.train:app"
cl-splats-eval = "clsplats.eval:app"
cl-splats-preprocess = "clsplats.utils.preprocessing:main"

[tool.setuptools.packages.find]
include = ["clsplats*", "simple_knn*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=clsplats --cov-report=term-missing"
